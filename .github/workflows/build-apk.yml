
name: Compila Etichetta Facile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Estrai progetto
        run: |
          mkdir progetto
          unzip -q EtichettaFacile_progetto_corretto_v2.zip -d progetto

      - name: Compila APK
        run: gradle -p progetto assembleDebug

      - name: Pubblica APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EtichettaFacile-APK
          path: progetto/app/build/outputs/apk/debug/app-debug.apk
